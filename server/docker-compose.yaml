name: mem0-dev

services:
  mem0:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ..
      dockerfile: server/dev.Dockerfile
    ports:
      - "${MEM0_API_PORT:-8888}:8000"
    env_file:
      - .env
    networks:
      - mem0_network
    volumes:
      - ./history:/app/history
      - .:/app
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=
      - DASHBOARD_URL=${DASHBOARD_URL:-http://localhost:3000}
      - APP_DB_NAME=${APP_DB_NAME:-mem0_app}
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_DISABLED=${AUTH_DISABLED:-false}
      - MEM0_TELEMETRY=${MEM0_TELEMETRY:-true}

  mem0-dashboard:
    build: ./dashboard
    ports:
      - "${MEM0_DASHBOARD_PORT:-3000}:3000"
    networks:
      - mem0_network
    environment:
      - DASHBOARD_URL=${DASHBOARD_URL:-http://localhost:3000}
      - NEXT_PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:8888}
      - API_INTERNAL_URL=http://mem0:8000
      - NEXT_PUBLIC_INSTANCE_NAME=Mem0
    depends_on:
      mem0:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_db:

networks:
  mem0_network:
    driver: bridge
