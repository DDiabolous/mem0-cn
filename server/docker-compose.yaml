name: mem0-dev

services:
  mem0:
    build:
      context: ..
      dockerfile: server/dev.Dockerfile
    ports:
      - "8888:8000"
    env_file:
      - .env
    networks:
      - mem0_network
    volumes:
      - ./history:/app/history
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=
      - DASHBOARD_URL=${DASHBOARD_URL:-http://localhost:3000}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=5432
      - POSTGRES_DB=mem0
      - POSTGRES_USER=${POSTGRES_USER:?Set POSTGRES_USER in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_COLLECTION_NAME=memories
      - APP_DB_NAME=mem0_app
      - DASHSCOPE_BASE_URL=${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
      - MEM0_DEFAULT_LLM_PROVIDER=dashscope
      - MEM0_DEFAULT_EMBEDDER_PROVIDER=dashscope
      - MEM0_DEFAULT_LLM_MODEL=qwen3.8-flash
      - MEM0_DEFAULT_EMBEDDER_MODEL=qwen3.7-text-embedding-flash
      - MEM0_RERANK_ENABLED=false
      - MEM0_RERANK_MODEL=qwen3.7-text-rerank
      - REQUEST_LOG_RETENTION_DAYS=30
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_DISABLED=false
      - MEM0_TELEMETRY=true

  postgres:
    image: pgvector/pgvector:pg17
    restart: on-failure
    shm_size: 128mb
    networks:
      - mem0_network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      APP_DB_NAME: mem0_app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -d \"$$POSTGRES_DB\" -U \"$$POSTGRES_USER\""]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_db:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "8432:5432"

  mem0-dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    networks:
      - mem0_network
    environment:
      - DASHBOARD_URL=${DASHBOARD_URL:-http://localhost:3000}
      - NEXT_PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:8888}
      - API_INTERNAL_URL=http://mem0:8000
      - NEXT_PUBLIC_INSTANCE_NAME=Mem0
    depends_on:
      mem0:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_db:

networks:
  mem0_network:
    driver: bridge
